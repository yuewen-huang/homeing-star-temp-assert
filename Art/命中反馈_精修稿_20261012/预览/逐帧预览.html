let running=true,t=0,last=performance.now();const cards=clips.map(c=>{const a=document.createElement('article');a.innerHTML='<h2>'+c.name+'</h2><figure><img></figure><p class="hint"></p><input type="range" min="0" max="'+(c.frames.length-1)+'" value="0">';document.querySelector('#cards').append(a);const im=a.querySelector('img'),p=a.querySelector('p'),slider=a.querySelector('input');const show=i=>{im.src=c.frames[i];im.style.visibility='visible';p.textContent='第 '+(i+1)+' / '+c.frames.length+' 帧 · '+c.durations[i]+' ms';slider.value=i;};slider.oninput=()=>{running=false;document.querySelector('#play').textContent='播放';show(+slider.value)};show(0);return {c,im,p,slider,show}});
document.querySelector('#play').onclick=()=>{running=!running;document.querySelector('#play').textContent=running?'暂停':'播放';};document.querySelector('#bg').onchange=e=>document.querySelectorAll('figure').forEach(f=>f.style.background=e.target.value);
function frame(now){if(running)t+=(now-last)*Number(document.querySelector('#speed').value);last=now;for(const a of cards){if(!running)continue;let local=t%1000;const total=a.c.durations.reduce((x,y)=>x+y,0);if(local>=total){a.im.style.visibility='hidden';a.p.textContent='循环停顿';continue;}let i=0;while(local>=a.c.durations[i]){local-=a.c.durations[i];i++;}a.show(i);}requestAnimationFrame(frame);}requestAnimationFrame(frame);</script></html>
